<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartoon Duniya</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#7fd6ff;--sun:#ffd23f;--pink:#ff6b9d;--grass:#5ed36b;--ink:#1b1b2f;--paper:#fffdf4;--card:#ffffff;--shadow:#1b1b2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#2a6fa8;--paper:#2b2850;--card:#3a3670;--ink:#fffdf4;--shadow:#000}}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Fredoka','Comic Sans MS',sans-serif;font-weight:500;color:var(--ink);background:var(--sky);
background-image:radial-gradient(rgba(255,255,255,.55) 3px,transparent 3.5px);background-size:28px 28px;min-height:100vh;overflow-x:hidden}
.cloud{position:fixed;width:120px;height:40px;background:#fff;border:4px solid #1b1b2f;border-radius:40px;opacity:.95;z-index:0;animation:drift 30s linear infinite}
.cloud::before{content:"";position:absolute;left:18px;top:-22px;width:50px;height:50px;background:#fff;border:4px solid #1b1b2f;border-radius:50%;border-bottom-color:transparent;border-right-color:transparent}
.c1{top:90px;left:-150px}.c2{top:260px;left:-150px;animation-duration:45s;animation-delay:-15s;transform:scale(.7)}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;padding:18px 0 10px}
h1{font-family:'Bangers','Impact',sans-serif;font-weight:400;font-size:clamp(48px,13vw,92px);letter-spacing:3px;margin:0;line-height:1;color:var(--sun);
-webkit-text-stroke:3px #1b1b2f;paint-order:stroke fill;text-shadow:5px 5px 0 #1b1b2f;display:inline-block;transform:rotate(-3deg);animation:pop 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(-3deg)}}
.tag{display:inline-block;margin-top:14px;background:var(--pink);color:#fff;border:4px solid #1b1b2f;border-radius:999px;padding:6px 18px;font-weight:700;box-shadow:4px 4px 0 var(--shadow);transform:rotate(2deg)}
.tv{margin:26px 0 8px;background:var(--card);border:5px solid #1b1b2f;border-radius:28px;padding:14px;box-shadow:9px 9px 0 var(--shadow)}
.screen{position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#ffe27a 0 18px,#ffd23f 18px 36px);border:4px solid #1b1b2f;border-radius:18px;overflow:hidden;display:grid;place-items:center;text-align:center}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{padding:16px;font-family:'Bangers',sans-serif;font-size:clamp(22px,5vw,38px);letter-spacing:1.5px;color:#1b1b2f}
.empty span{display:block;font-size:64px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(8deg)}}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;font:inherit;padding:12px 16px;border:4px solid #1b1b2f;border-radius:999px;background:#fff;color:#1b1b2f}
input:focus-visible,button:focus-visible,a:focus-visible{outline:4px dashed var(--pink);outline-offset:3px}
.btn{font-family:'Bangers',sans-serif;font-size:22px;letter-spacing:1.5px;padding:10px 22px;border:4px solid #1b1b2f;border-radius:999px;background:var(--grass);color:#1b1b2f;cursor:pointer;box-shadow:4px 4px 0 var(--shadow);transition:transform .12s,box-shadow .12s;text-decoration:none;display:inline-block}
.btn[hidden]{display:none}
.btn:hover{transform:translate(-2px,-2px) rotate(-2deg);box-shadow:7px 7px 0 var(--shadow)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow)}
.msg{min-height:24px;margin:10px 4px 0;font-weight:700}
h2{font-family:'Bangers',sans-serif;font-weight:400;font-size:34px;letter-spacing:2px;margin:34px 0 14px;color:#fff;-webkit-text-stroke:2px #1b1b2f;paint-order:stroke fill;text-shadow:3px 3px 0 #1b1b2f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.pick{font-family:'Bangers',sans-serif;font-size:24px;letter-spacing:1.5px;text-align:center;color:#1b1b2f;text-decoration:none;padding:20px 8px;border:4px solid #1b1b2f;border-radius:22px;box-shadow:5px 5px 0 var(--shadow);transition:transform .15s}
.pick b{display:block;font-size:44px;font-weight:400;line-height:1.1}
.pick:hover{transform:rotate(-4deg) scale(1.06)}
.pick:nth-child(4n+1){background:#ffd23f}.pick:nth-child(4n+2){background:#ff9ec1}.pick:nth-child(4n+3){background:#9be7a1}.pick:nth-child(4n){background:#b9a6ff}
.hint{margin-top:30px;background:var(--card);border:4px dashed #1b1b2f;border-radius:20px;padding:14px 18px;font-size:15px}
.ground{position:fixed;left:0;right:0;bottom:0;height:22px;background:var(--grass);border-top:5px solid #1b1b2f;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vids{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.vid{font:inherit;text-align:left;padding:0;background:var(--card);color:var(--ink);border:4px solid #1b1b2f;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:5px 5px 0 var(--shadow);transition:transform .15s}
.vid:hover{transform:rotate(-2deg) scale(1.03)}
.vid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:4px solid #1b1b2f}
.vid span{display:block;padding:8px 12px;font-size:14px;font-weight:700}
summary{cursor:pointer;font-weight:700}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="wrap">
<header>
<h1>Cartoon Duniya!</h1><br>
<span class="tag">Chalo, cartoon dekhte hain 🎉</span>
</header>

<main>
<section class="tv" aria-label="Cartoon player">
<div class="screen" id="screen">
<div class="empty"><span>📺</span>Cartoon ka naam likho<br>aur Dhundo dabao!</div>
</div>
<div class="row">
<input id="q" type="search" placeholder="Cartoon ka naam likho, jaise Tom and Jerry" aria-label="Cartoon search">
<button class="btn" id="go" type="button">Dhundo!</button>
</div>
<p class="msg" id="msg" role="status"></p>
<a class="btn" id="watch" href="#" target="_blank" rel="noopener" hidden>YouTube par dekho</a>
</section>

<h2>Apna favourite chuno</h2>
<div class="grid" id="picks"></div>

<h2>Videos</h2>
<div class="grid vids" id="res"></div>
</main>
</div>
<div class="ground"></div>

<script>
var picks=[["🐭","Tom and Jerry"],["🤖","Doraemon"],["🦸","Shin Chan"],["🐘","Chhota Bheem"],["🐻","Motu Patlu"],["🧽","SpongeBob"],["🐱","Oggy"],["🚀","Ninja Hattori"]];
var KEY="AIzaSyDudljWyHUaPhUW1Ux3NeSHZQkRU1fVFcc";
var $=function(i){return document.getElementById(i)};
var g=$("picks");
picks.forEach(function(p){
  var b=document.createElement("button");b.type="button";b.className="pick";
  b.style.font="inherit";b.style.cursor="pointer";b.style.fontFamily="'Bangers',sans-serif";
  b.innerHTML="<b>"+p[0]+"</b>"+p[1];
  b.onclick=function(){$("q").value=p[1];search();};
  g.appendChild(b);
});
function search(){
  var q=$("q").value.trim(),msg=$("msg"),res=$("res");
  if(!q){msg.textContent="Pehle cartoon ka naam likho.";return;}
  msg.textContent="Dhund rahe hain...";
  var u="https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&safeSearch=strict&maxResults=12&q="+encodeURIComponent(q+" cartoon")+"&key="+encodeURIComponent(KEY);
  fetch(u).then(function(r){return r.json()}).then(function(d){
    if(d.error){msg.textContent="API error: "+d.error.message;return;}
    res.innerHTML="";
    (d.items||[]).forEach(function(it){
      var b=document.createElement("button");b.type="button";b.className="vid";
      var im=document.createElement("img");im.src=it.snippet.thumbnails.medium.url;im.alt="";
      var t=document.createElement("span");t.textContent=it.snippet.title;
      b.appendChild(im);b.appendChild(t);
      b.onclick=function(){playVid(it.id.videoId);};
      res.appendChild(b);
    });
    msg.textContent=(d.items||[]).length?"Koi bhi video chuno!":"Kuch nahi mila, doosra naam try karo.";
  }).catch(function(){msg.textContent="Network error. Page apni site par host karke kholo.";});
}
function playVid(id){
  var o="";try{if(location.protocol.indexOf("http")===0)o="&origin="+encodeURIComponent(location.origin);}catch(e){}
  $("screen").innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1'+o+'" title="Cartoon" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
  $("watch").href="https://www.youtube.com/watch?v="+id;$("watch").hidden=false;
  $("screen").scrollIntoView({behavior:"smooth",block:"center"});
  $("msg").textContent="Maza karo! 🍿";
}
$("go").onclick=search;
$("q").addEventListener("keydown",function(e){if(e.key==="Enter")search();});
</script>
</body>
</html>
