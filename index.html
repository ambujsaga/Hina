<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartoon Duniya</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#7fd6ff;--sun:#ffd23f;--pink:#ff6b9d;--grass:#5ed36b;--ink:#1b1b2f;--paper:#fffdf4;--card:#ffffff;--shadow:#1b1b2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#2a6fa8;--paper:#2b2850;--card:#3a3670;--ink:#fffdf4;--shadow:#000}}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Fredoka','Comic Sans MS',sans-serif;font-weight:500;color:var(--ink);background:var(--sky);
background-image:radial-gradient(rgba(255,255,255,.55) 3px,transparent 3.5px);background-size:28px 28px;min-height:100vh;overflow-x:hidden}
.cloud{position:fixed;width:120px;height:40px;background:#fff;border:4px solid #1b1b2f;border-radius:40px;opacity:.95;z-index:0;animation:drift 30s linear infinite}
.cloud::before{content:"";position:absolute;left:18px;top:-22px;width:50px;height:50px;background:#fff;border:4px solid #1b1b2f;border-radius:50%;border-bottom-color:transparent;border-right-color:transparent}
.c1{top:90px;left:-150px}.c2{top:260px;left:-150px;animation-duration:45s;animation-delay:-15s;transform:scale(.7)}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;padding:18px 0 10px}
h1{font-family:'Bangers','Impact',sans-serif;font-weight:400;font-size:clamp(48px,13vw,92px);letter-spacing:3px;margin:0;line-height:1;color:var(--sun);
-webkit-text-stroke:3px #1b1b2f;paint-order:stroke fill;text-shadow:5px 5px 0 #1b1b2f;display:inline-block;transform:rotate(-3deg);animation:pop 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(-3deg)}}
.tag{display:inline-block;margin-top:14px;background:var(--pink);color:#fff;border:4px solid #1b1b2f;border-radius:999px;padding:6px 18px;font-weight:700;box-shadow:4px 4px 0 var(--shadow);transform:rotate(2deg)}
.tv{margin:26px 0 8px;background:var(--card);border:5px solid #1b1b2f;border-radius:28px;padding:14px;box-shadow:9px 9px 0 var(--shadow)}
.screen{position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#ffe27a 0 18px,#ffd23f 18px 36px);border:4px solid #1b1b2f;border-radius:18px;overflow:hidden;display:grid;place-items:center;text-align:center}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{padding:16px;font-family:'Bangers',sans-serif;font-size:clamp(22px,5vw,38px);letter-spacing:1.5px;color:#1b1b2f}
.empty span{display:block;font-size:64px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(8deg)}}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;font:inherit;padding:12px 16px;border:4px solid #1b1b2f;border-radius:999px;background:#fff;color:#1b1b2f}
input:focus-visible,button:focus-visible,a:focus-visible{outline:4px dashed var(--pink);outline-offset:3px}
.btn{font-family:'Bangers',sans-serif;font-size:22px;letter-spacing:1.5px;padding:10px 22px;border:4px solid #1b1b2f;border-radius:999px;background:var(--grass);color:#1b1b2f;cursor:pointer;box-shadow:4px 4px 0 var(--shadow);transition:transform .12s,box-shadow .12s;text-decoration:none;display:inline-block}
.btn[hidden]{display:none}
.btn:hover{transform:translate(-2px,-2px) rotate(-2deg);box-shadow:7px 7px 0 var(--shadow)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow)}
.msg{min-height:24px;margin:10px 4px 0;font-weight:700}
h2{font-family:'Bangers',sans-serif;font-weight:400;font-size:34px;letter-spacing:2px;margin:34px 0 14px;color:#fff;-webkit-text-stroke:2px #1b1b2f;paint-order:stroke fill;text-shadow:3px 3px 0 #1b1b2f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.pick{font-family:'Bangers',sans-serif;font-size:24px;letter-spacing:1.5px;text-align:center;color:#1b1b2f;text-decoration:none;padding:20px 8px;border:4px solid #1b1b2f;border-radius:22px;box-shadow:5px 5px 0 var(--shadow);transition:transform .15s}
.pick b{display:block;font-size:44px;font-weight:400;line-height:1.1}
.pick:hover{transform:rotate(-4deg) scale(1.06)}
.pick:nth-child(4n+1){background:#ffd23f}.pick:nth-child(4n+2){background:#ff9ec1}.pick:nth-child(4n+3){background:#9be7a1}.pick:nth-child(4n){background:#b9a6ff}
.hint{margin-top:30px;background:var(--card);border:4px dashed #1b1b2f;border-radius:20px;padding:14px 18px;font-size:15px}
.ground{position:fixed;left:0;right:0;bottom:0;height:22px;background:var(--grass);border-top:5px solid #1b1b2f;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vids{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.vid{font:inherit;text-align:left;padding:0;background:var(--card);color:var(--ink);border:4px solid #1b1b2f;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:5px 5px 0 var(--shadow);transition:transform .15s}
.vid:hover{transform:rotate(-2deg) scale(1.03)}
.vid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:4px solid #1b1b2f}
.vid span{display:block;padding:8px 12px;font-size:14px;font-weight:700}
summary{cursor:pointer;font-weight:700}
/* ===== YouTube-style player ===== */
.screen.has-player{background:#000}
.pl{position:absolute;inset:0;background:#000;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.zone{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.zl{left:0}.zr{right:0}
.ripple{position:absolute;top:50%;width:110px;height:110px;margin-top:-55px;border-radius:50%;background:rgba(255,255,255,.28);z-index:3;display:none;place-items:center;text-align:center;font-weight:700;font-size:15px;line-height:1.3;pointer-events:none}
.ripple.on{display:grid;animation:rp .6s ease-out both}
.rl{left:10%}.rr{right:10%}
@keyframes rp{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.ctl{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:30px 10px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;pointer-events:none;transition:opacity .2s}
.pl.show .ctl{opacity:1;pointer-events:auto}
.ctl .bar{display:flex;align-items:center;gap:2px}
.ctl button{background:none;border:0;color:#fff;padding:0;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;border-radius:50%;box-shadow:none;font:inherit}
.ctl button:hover{background:rgba(255,255,255,.18)}
.ctl button svg{width:28px;height:28px;fill:currentColor}
.ctl .time{font-size:13px;font-weight:700;white-space:nowrap;margin:0 8px}
.ctl .sp{flex:1}
.ctl input[type=range]{flex:none;display:block;width:100%;min-width:0;margin:0 0 4px;padding:0;border:0;border-radius:0;background:none;height:20px;accent-color:#f00;cursor:pointer}
.screen.fs{position:fixed;inset:0;z-index:9999;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border:0;border-radius:0}
.screen.fs .ctl{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom))}
/* Fullscreen: kaali background, YouTube jaisa fit (16:9) aur pinch-out se zoom-to-fill */
.screen.fs,.screen:fullscreen,.screen:-webkit-full-screen{background:#000}
.screen.fs .pl{overflow:hidden;touch-action:none}
.screen.fs.fill .pl iframe{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);
width:max(100vw,calc(100vh*16/9));height:max(100vh,calc(100vw*9/16));
width:max(100vw,calc(100dvh*16/9));height:max(100dvh,calc(100vw*9/16))}
body.fsmode{overflow:hidden}
body.fsmode .ground,body.fsmode .cloud{display:none}
/* ===== Side nav button + Favourite page ===== */
.sidenav{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:5;width:34px;height:64px;padding:0;display:grid;place-items:center;border:2px solid rgba(27,27,47,.35);border-right:0;border-radius:18px 0 0 18px;background:rgba(255,255,255,.28);color:#1b1b2f;font-size:22px;font-weight:700;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:.75;transition:opacity .15s,width .15s,background .15s;-webkit-tap-highlight-color:transparent}
.sidenav:hover,.sidenav:focus-visible{opacity:1;width:40px;background:rgba(255,255,255,.5)}
.sidenav[hidden]{display:none}
body.fsmode .sidenav{display:none}
.favpage{position:fixed;inset:0;z-index:9000;overflow-y:auto;background:var(--sky);background-image:radial-gradient(rgba(255,255,255,.55) 3px,transparent 3.5px);background-size:28px 28px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.favpage[hidden]{display:none}
.favpage .wrap{padding-bottom:60px}
.favbar{display:flex;align-items:center;gap:12px;margin-top:8px}
.favbar h2{margin:0}
.favbar .btn{font-size:20px;padding:8px 18px}
/* ===== Offline Library ===== */
.sr{position:absolute;width:1px;height:1px;opacity:0;overflow:hidden;pointer-events:none}
.btn:focus-within{outline:4px dashed var(--pink);outline-offset:3px}
.btn.red{background:var(--pink)}
.btn.sm{font-size:17px;padding:6px 14px}
.off{margin-top:8px}
.offnote{margin:2px 4px 0;font-size:15px}
.off .vids{margin-top:14px}
.offcard{background:var(--card);color:var(--ink);border:4px solid #1b1b2f;border-radius:18px;box-shadow:5px 5px 0 var(--shadow);padding:12px;display:flex;flex-direction:column;gap:8px}
.offcard .nm{font-weight:700;font-size:14px;word-break:break-word}
.offcard .sz{font-size:13px;opacity:.8}
.offcard .acts{display:flex;gap:8px;flex-wrap:wrap}
.offempty{grid-column:1/-1;margin:0;padding:6px 4px;font-weight:700}
.screen video{position:absolute;inset:0;width:100%;height:100%;background:#000}
.offbar{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:6;background:var(--ink);color:var(--paper);border:3px solid #1b1b2f;border-radius:999px;padding:6px 16px;font-size:14px;font-weight:700}
.offbar[hidden]{display:none}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="wrap">
<header>
<h1>Cartoon Duniya!</h1><br>
<span class="tag">Chalo, cartoon dekhte hain 🎉</span>
</header>

<main>
<section class="tv" aria-label="Cartoon player">
<div class="screen" id="screen">
<div class="empty"><span>📺</span>Cartoon ka naam likho<br>aur Dhundo dabao!</div>
</div>
<div class="row">
<input id="q" type="search" placeholder="Cartoon ka naam likho, jaise Tom and Jerry" aria-label="Cartoon search">
<button class="btn" id="go" type="button">Dhundo!</button>
</div>
<p class="msg" id="msg" role="status"></p>
<a class="btn" id="watch" href="#" target="_blank" rel="noopener" hidden>YouTube par dekho</a>
</section>

<h2>Videos</h2>
<div style="margin-bottom:14px"><button class="btn" id="again" type="button" hidden>🔄 Naye videos dikhao</button></div>
<div class="grid vids" id="res"></div>

<h2>Offline Library 📥</h2>
<section class="tv off" aria-label="Offline library">
<p class="offnote">Apni khud ki ya licensed videos yahan save karo. Ek baar save hone ke baad bina internet ke bhi chalengi.</p>
<div class="row">
<label class="btn" for="offFile">📂 Video chuno</label>
<input class="sr" id="offFile" type="file" accept="video/*" multiple>
</div>
<div class="row">
<input id="offUrl" type="url" placeholder="Ya seedha .mp4 link daalo (jiski permission ho)" aria-label="Video ka seedha link">
<button class="btn" id="offGo" type="button">Save karo</button>
</div>
<p class="msg" id="offMsg" role="status"></p>
<div class="grid vids" id="offList"></div>
<p class="msg" id="offStore"></p>
</section>
</main>
</div>
<button class="sidenav" id="favBtn" type="button" aria-label="Apna favourite chuno kholo" title="Apna favourite chuno">&#8249;</button>
<div class="favpage" id="favPage" role="dialog" aria-modal="true" aria-label="Apna favourite chuno" hidden>
<div class="wrap">
<div class="favbar"><button class="btn" id="favBack" type="button">&larr; Wapas</button></div>
<h2>Apna favourite chuno</h2>
<div class="grid" id="picks"></div>
</div>
</div>
<div class="offbar" id="offBar" hidden>📴 Internet band hai</div>
<div class="ground"></div>

<script>
var picks=[["🐭","Tom and Jerry"],["🤖","Doraemon"],["🦸","Shin Chan"],["🐘","Chhota Bheem"],["🐻","Motu Patlu"],["🧽","SpongeBob"],["🐱","Oggy"],["🚀","Ninja Hattori"]];
var KEY="AIzaSyDudljWyHUaPhUW1Ux3NeSHZQkRU1fVFcc";
var $=function(i){return document.getElementById(i)};
var g=$("picks");
picks.forEach(function(p){
  var b=document.createElement("button");b.type="button";b.className="pick";
  b.style.font="inherit";b.style.cursor="pointer";b.style.fontFamily="'Bangers',sans-serif";
  b.innerHTML="<b>"+p[0]+"</b>"+p[1];
  b.onclick=function(){$("q").value=p[1];closeFav();search();};
  g.appendChild(b);
});
/* ===== Har baar naye videos ===== */
var ORD=["relevance","viewCount","rating","relevance"];
var SUF=["cartoon","cartoon full episode","cartoon hindi","cartoon new episode","cartoon funny moments","cartoon compilation","cartoon episodes"];
var SEEN_KEY="cd_seen",reqId=0;
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a}
function getSeen(){try{return JSON.parse(localStorage.getItem(SEEN_KEY)||"[]")}catch(e){return[]}}
function addSeen(ids){try{var s=getSeen().filter(function(x){return ids.indexOf(x)<0}).concat(ids).slice(-400);localStorage.setItem(SEEN_KEY,JSON.stringify(s));}catch(e){}}
function search(plain){
  plain=(plain===true);
  var q=$("q").value.trim(),msg=$("msg"),res=$("res");
  if(!q){msg.textContent="Pehle cartoon ka naam likho.";return;}
  msg.textContent="Dhund rahe hain...";
  var my=++reqId;
  var term=plain?q+" cartoon":q+" "+rnd(SUF);
  var u="https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&safeSearch=strict&maxResults=50&order="+(plain?"relevance":rnd(ORD))+"&q="+encodeURIComponent(term)+"&key="+encodeURIComponent(KEY);
  fetch(u).then(function(r){return r.json()}).then(function(d){
    if(my!==reqId)return;
    if(d.error){msg.textContent="API error: "+d.error.message;return;}
    var items=(d.items||[]).filter(function(it){return it.id&&it.id.videoId});
    if(!items.length&&!plain){search(true);return;}
    var seen=getSeen();
    var fresh=shuffle(items.filter(function(it){return seen.indexOf(it.id.videoId)<0}));
    var old=shuffle(items.filter(function(it){return seen.indexOf(it.id.videoId)>=0}));
    var show=shuffle(fresh.concat(old).slice(0,12));
    res.innerHTML="";
    show.forEach(function(it){
      var b=document.createElement("button");b.type="button";b.className="vid";
      var th=it.snippet.thumbnails||{};
      var im=document.createElement("img");im.src=(th.medium||th.default||{}).url||"";im.alt="";
      var t=document.createElement("span");t.textContent=it.snippet.title;
      b.appendChild(im);b.appendChild(t);
      b.onclick=function(){playVid(it.id.videoId);};
      res.appendChild(b);
    });
    addSeen(show.map(function(it){return it.id.videoId}));
    $("again").hidden=!show.length;
    msg.textContent=show.length?"Koi bhi video chuno!":"Kuch nahi mila, doosra naam try karo.";
  }).catch(function(){msg.textContent=(navigator.onLine===false)?"Internet nahi hai. Neeche Offline Library se video chalao.":"Network error. Page apni site par host karke kholo.";});
}

/* ===== YouTube jaisa player ===== */
function svg(p){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>'}
var RP="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z";
var TX='<text x="12" y="15.6" font-size="7" text-anchor="middle" font-weight="700" style="font-family:Arial,sans-serif">10</text>';
var IC={
  play:svg('<path d="M8 5v14l11-7z"/>'),
  pause:svg('<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'),
  back:svg('<path d="'+RP+'"/>'+TX),
  fwd:svg('<path transform="translate(24 0) scale(-1 1)" d="'+RP+'"/>'+TX),
  vol:svg('<path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.47 4.47 0 0 0 2.5-4z"/>'),
  mute:svg('<path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'),
  fs:svg('<path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/>'),
  fsx:svg('<path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/>')
};
var yt=null,ytReady=false,ytLoading=false,ytCbs=[],pendingId=null,curId=null,tick=null,dragging=false,hideT=null,tapT=null,lastTap=0,lastSide="",lastSeekAt=0,lastSeekSide="";
function fmt(s){s=Math.max(0,Math.floor(s||0));var h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=s%60;return (h?h+":"+(m<10?"0":""):"")+m+":"+(c<10?"0":"")+c}
function loadYT(cb){
  if(window.YT&&YT.Player){cb(true);return;}
  ytCbs.push(cb);if(ytLoading)return;ytLoading=true;
  window.onYouTubeIframeAPIReady=function(){ytLoading=false;ytCbs.splice(0).forEach(function(f){f(true)});};
  var sc=document.createElement("script");sc.src="https://www.youtube.com/iframe_api";
  sc.onerror=function(){ytLoading=false;ytCbs.splice(0).forEach(function(f){f(false)});};
  document.head.appendChild(sc);
}
function isPlaying(){try{return yt&&ytReady&&yt.getPlayerState()===1}catch(e){return false}}
function showCtl(){var pl=$("pl");if(!pl)return;pl.classList.add("show");clearTimeout(hideT);if(isPlaying())hideT=setTimeout(function(){if(!dragging)pl.classList.remove("show")},3000);}
function toggleCtl(){var pl=$("pl");if(!pl)return;if(pl.classList.contains("show")&&isPlaying()){pl.classList.remove("show");clearTimeout(hideT);}else showCtl();}
function togglePlay(){if(!yt||!ytReady)return;try{isPlaying()?yt.pauseVideo():yt.playVideo();}catch(e){}showCtl();}
function seekBy(n){
  if(!yt||!ytReady)return;
  try{var d=yt.getDuration()||0,c=yt.getCurrentTime()||0,t=Math.max(0,c+n);if(d)t=Math.min(d,t);yt.seekTo(t,true);
  $("seek").value=t;$("tm").textContent=fmt(t)+" / "+fmt(d);}catch(e){}
  showCtl();
}
function ripple(side){var r=$(side==="l"?"rl":"rr");r.classList.remove("on");void r.offsetWidth;r.classList.add("on");setTimeout(function(){r.classList.remove("on")},600);}
function zoneTap(side){
  var now=Date.now();
  if(lastSeekSide===side&&now-lastSeekAt<700){clearTimeout(tapT);lastSeekAt=now;seekBy(side==="l"?-10:10);ripple(side);return;}
  if(lastSide===side&&now-lastTap<300){clearTimeout(tapT);lastTap=0;lastSeekAt=now;lastSeekSide=side;seekBy(side==="l"?-10:10);ripple(side);return;}
  lastSide=side;lastTap=now;clearTimeout(tapT);tapT=setTimeout(toggleCtl,300);
}
function isFs(){return $("screen").classList.contains("fs")}
function updFsIcon(){var b=$("bFs");if(b)b.innerHTML=isFs()?IC.fsx:IC.fs;}
function enterFs(){
  var s=$("screen");s.classList.add("fs");document.body.classList.add("fsmode");
  var lockL=function(){try{if(screen.orientation&&screen.orientation.lock){var q=screen.orientation.lock("landscape");if(q&&q.catch)q.catch(function(){});}}catch(e){}};
  try{var f=s.requestFullscreen||s.webkitRequestFullscreen;if(f){var p=f.call(s);if(p&&p.then)p.then(lockL,function(){});else lockL();}}catch(e){}
  updFsIcon();
}
function exitFs(){
  var s=$("screen");s.classList.remove("fs");s.classList.remove("fill");document.body.classList.remove("fsmode");
  try{if(screen.orientation&&screen.orientation.unlock)screen.orientation.unlock();}catch(e){}
  try{if(document.fullscreenElement||document.webkitFullscreenElement){var x=document.exitFullscreen||document.webkitExitFullscreen;var p=x.call(document);if(p&&p.catch)p.catch(function(){});}}catch(e){}
  updFsIcon();
}
function onFsChange(){if(!document.fullscreenElement&&!document.webkitFullscreenElement&&isFs())exitFs();}
document.addEventListener("fullscreenchange",onFsChange);
document.addEventListener("webkitfullscreenchange",onFsChange);
/* Phone 90 degree ghumao -> video poori screen (landscape) me */
var mq=window.matchMedia("(orientation:landscape) and (pointer:coarse) and (max-height:600px)");
function onRot(){if(!curId||!$("pl"))return;if(mq.matches){if(!isFs())enterFs();}else if(isFs())exitFs();}
if(mq.addEventListener)mq.addEventListener("change",onRot);else if(mq.addListener)mq.addListener(onRot);

function buildPlayer(){
  if($("pl"))return;
  yt=null;ytReady=false;pendingId=null;
  var s=$("screen");s.classList.add("has-player");
  s.innerHTML='<div class="pl show" id="pl"><div id="ytp"></div>'
   +'<div class="zone zl" id="zl"></div><div class="zone zr" id="zr"></div>'
   +'<div class="ripple rl" id="rl">&laquo;<br>10 sec</div><div class="ripple rr" id="rr">10 sec<br>&raquo;</div>'
   +'<div class="ctl" id="ctl"><input id="seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Video seek">'
   +'<div class="bar"><button type="button" id="bPlay" aria-label="Play ya pause"></button>'
   +'<button type="button" id="bBack" aria-label="10 second peeche"></button>'
   +'<button type="button" id="bFwd" aria-label="10 second aage"></button>'
   +'<span class="time" id="tm">0:00 / 0:00</span><span class="sp"></span>'
   +'<button type="button" id="bMute" aria-label="Awaaz band ya chalu"></button>'
   +'<button type="button" id="bFs" aria-label="Poori screen"></button></div></div></div>';
  $("bPlay").innerHTML=IC.play;$("bBack").innerHTML=IC.back;$("bFwd").innerHTML=IC.fwd;$("bMute").innerHTML=IC.vol;$("bFs").innerHTML=IC.fs;
  $("zl").onclick=function(){zoneTap("l")};$("zr").onclick=function(){zoneTap("r")};
  $("bPlay").onclick=togglePlay;
  $("bBack").onclick=function(){seekBy(-10)};$("bFwd").onclick=function(){seekBy(10)};
  $("bMute").onclick=function(){if(!yt||!ytReady)return;try{if(yt.isMuted()){yt.unMute();$("bMute").innerHTML=IC.vol;}else{yt.mute();$("bMute").innerHTML=IC.mute;}}catch(e){}showCtl();};
  $("bFs").onclick=function(){isFs()?exitFs():enterFs();showCtl();};
  var sk=$("seek");
  sk.addEventListener("input",function(){dragging=true;$("tm").textContent=fmt(+sk.value)+" / "+fmt(+sk.max);showCtl();});
  sk.addEventListener("change",function(){try{yt.seekTo(+sk.value,true);}catch(e){}dragging=false;showCtl();});
  $("pl").addEventListener("mousemove",showCtl);
  $("ctl").addEventListener("click",showCtl);
  var pd=0;
  function pdist(t){var x=t[0].clientX-t[1].clientX,y=t[0].clientY-t[1].clientY;return Math.sqrt(x*x+y*y);}
  $("pl").addEventListener("touchstart",function(e){if(e.touches.length===2)pd=pdist(e.touches);},{passive:true});
  $("pl").addEventListener("touchmove",function(e){
    if(e.touches.length!==2||!pd||!isFs())return;
    var r=pdist(e.touches)/pd;
    if(r>1.2){$("screen").classList.add("fill");pd=0;}else if(r<0.8){$("screen").classList.remove("fill");pd=0;}
  },{passive:true});
  $("pl").addEventListener("touchend",function(e){if(e.touches.length<2)pd=0;},{passive:true});
  clearInterval(tick);
  tick=setInterval(function(){
    if(!yt||!ytReady||dragging)return;
    try{var d=yt.getDuration()||0,c=yt.getCurrentTime()||0;$("seek").max=d||100;$("seek").value=c;$("tm").textContent=fmt(c)+" / "+fmt(d);}catch(e){}
  },250);
}
function createYT(id){
  var pv={autoplay:1,controls:0,rel:0,playsinline:1,modestbranding:1,fs:0,iv_load_policy:3,disablekb:1};
  try{if(location.protocol.indexOf("http")===0)pv.origin=location.origin;}catch(e){}
  yt=new YT.Player("ytp",{videoId:id,width:"100%",height:"100%",playerVars:pv,events:{
    onReady:function(){ytReady=true;if(pendingId){yt.loadVideoById(pendingId);pendingId=null;}},
    onStateChange:function(e){
      var p=e.data===1;$("bPlay").innerHTML=p?IC.pause:IC.play;
      if(p)showCtl();else{$("pl").classList.add("show");clearTimeout(hideT);}
    },
    onError:function(){$("msg").textContent="Ye video yahan nahi chal sakta, doosra chuno.";$("pl").classList.add("show");}
  }});
}
function plainPlay(id){
  var o="";try{if(location.protocol.indexOf("http")===0)o="&origin="+encodeURIComponent(location.origin);}catch(e){}
  clearInterval(tick);yt=null;ytReady=false;
  $("screen").classList.remove("has-player");
  $("screen").innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1'+o+'" title="Cartoon" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
}
function playVid(id){
  curId=id;
  try{document.activeElement.blur();}catch(e){}
  $("watch").href="https://www.youtube.com/watch?v="+id;$("watch").hidden=false;
  buildPlayer();
  loadYT(function(ok){
    if(curId!==id)return;
    if(!ok){plainPlay(id);return;}
    if(yt&&ytReady){yt.loadVideoById(id);}
    else if(yt){pendingId=id;}
    else createYT(id);
  });
  if(mq.matches)enterFs();else $("screen").scrollIntoView({behavior:"smooth",block:"center"});
  $("msg").textContent="Maza karo! 🍿";
}
/* Keyboard: space/k play-pause, j/l 10s, arrows 5s, f fullscreen, m mute */
document.addEventListener("keydown",function(e){
  var t=e.target,tag=t&&t.tagName;
  if(tag==="INPUT"||tag==="TEXTAREA")return;
  if(e.key==="Escape"&&isFs()){exitFs();return;}
  if(!curId||!$("pl")||!yt||!ytReady)return;
  var k=e.key;
  if(k===" "&&tag==="BUTTON")return;
  if(k===" "||k==="k"){e.preventDefault();togglePlay();}
  else if(k==="j"){seekBy(-10);}else if(k==="l"){seekBy(10);}
  else if(k==="ArrowLeft"){e.preventDefault();seekBy(-5);}else if(k==="ArrowRight"){e.preventDefault();seekBy(5);}
  else if(k==="f"){isFs()?exitFs():enterFs();}
  else if(k==="m"){$("bMute").click();}
});

var favOpen=false;
function openFav(){var f=$("favPage");f.hidden=false;f.scrollTop=0;favOpen=true;document.body.style.overflow="hidden";try{history.pushState({fav:1},"")}catch(e){}}
function closeFav(){if(!favOpen)return;$("favPage").hidden=true;favOpen=false;document.body.style.overflow="";try{if(history.state&&history.state.fav)history.back();}catch(e){}}

loadYT(function(){});

$("q").addEventListener("keydown",function(e){if(e.key==="Enter")search();});

/* ===== Offline Library (IndexedDB) ===== */
var odb=null,offUrl=null;
function fmtSize(n){n=n||0;if(n<1048576)return Math.max(1,Math.round(n/1024))+" KB";if(n<1073741824)return (n/1048576).toFixed(1)+" MB";return (n/1073741824).toFixed(2)+" GB";}
function oOpen(cb){
  if(odb){cb(odb);return;}
  try{
    var r=indexedDB.open("cd_offline",1);
    r.onupgradeneeded=function(){var d=r.result;d.createObjectStore("meta",{keyPath:"id"});d.createObjectStore("blobs",{keyPath:"id"});};
    r.onsuccess=function(){odb=r.result;odb.onversionchange=function(){odb.close();odb=null;};cb(odb);};
    r.onerror=function(){cb(null);};
    r.onblocked=function(){cb(null);};
  }catch(e){cb(null);}
}
function oSave(name,blob,done){
  oOpen(function(d){
    if(!d){done(false);return;}
    var fin=false,end=function(ok){if(!fin){fin=true;done(ok);}};
    try{
      var id="v"+Date.now()+Math.floor(Math.random()*1000);
      var tx=d.transaction(["meta","blobs"],"readwrite");
      tx.objectStore("meta").put({id:id,name:name,size:blob.size,type:blob.type||"video/mp4",added:Date.now()});
      tx.objectStore("blobs").put({id:id,blob:blob});
      tx.oncomplete=function(){end(true);};
      tx.onerror=function(){end(false);};
      tx.onabort=function(){end(false);};
    }catch(e){end(false);}
  });
}
function oList(cb){
  oOpen(function(d){
    if(!d){cb([]);return;}
    try{
      var r=d.transaction("meta").objectStore("meta").getAll();
      r.onsuccess=function(){cb((r.result||[]).sort(function(a,b){return b.added-a.added;}));};
      r.onerror=function(){cb([]);};
    }catch(e){cb([]);}
  });
}
function oDel(id,cb){
  oOpen(function(d){
    if(!d){cb();return;}
    try{
      var tx=d.transaction(["meta","blobs"],"readwrite");
      tx.objectStore("meta").delete(id);tx.objectStore("blobs").delete(id);
      tx.oncomplete=cb;tx.onerror=cb;tx.onabort=cb;
    }catch(e){cb();}
  });
}
function offStorage(){
  var el=$("offStore");
  try{
    if(navigator.storage&&navigator.storage.estimate){
      navigator.storage.estimate().then(function(e){
        if(e&&e.quota)el.textContent="Jagah: "+fmtSize(e.usage)+" use hui, lagbhag "+fmtSize(e.quota)+" mein se.";
      }).catch(function(){});
    }
  }catch(e){}
}
function renderOff(){
  var box=$("offList");
  oList(function(items){
    box.innerHTML="";
    if(!items.length){var p=document.createElement("p");p.className="offempty";p.textContent="Abhi kuch save nahi hai. Upar se video chuno ya link daalo.";box.appendChild(p);}
    items.forEach(function(it){
      var c=document.createElement("div");c.className="offcard";
      var n=document.createElement("div");n.className="nm";n.textContent="🎬 "+it.name;
      var z=document.createElement("div");z.className="sz";z.textContent=fmtSize(it.size);
      var a=document.createElement("div");a.className="acts";
      var pb=document.createElement("button");pb.type="button";pb.className="btn sm";pb.textContent="▶ Chalao";
      pb.onclick=function(){playOff(it.id);};
      var db=document.createElement("button");db.type="button";db.className="btn sm red";db.textContent="🗑 Hatao";
      db.onclick=function(){oDel(it.id,function(){renderOff();offStorage();$("offMsg").textContent="Hata diya.";});};
      a.appendChild(pb);a.appendChild(db);
      c.appendChild(n);c.appendChild(z);c.appendChild(a);
      box.appendChild(c);
    });
    offStorage();
  });
}
function playOff(id){
  oOpen(function(d){
    if(!d)return;
    var r;
    try{r=d.transaction("blobs").objectStore("blobs").get(id);}catch(e){return;}
    r.onsuccess=function(){
      var rec=r.result;
      if(!rec){$("offMsg").textContent="Ye video nahi mili.";renderOff();return;}
      clearInterval(tick);yt=null;ytReady=false;curId=null;
      if(offUrl){try{URL.revokeObjectURL(offUrl);}catch(e){}}
      offUrl=URL.createObjectURL(rec.blob);
      var s=$("screen");s.classList.add("has-player");s.innerHTML="";
      var v=document.createElement("video");
      v.src=offUrl;v.controls=true;v.autoplay=true;v.setAttribute("playsinline","");
      s.appendChild(v);
      $("watch").hidden=true;
      $("msg").textContent="Offline video chal rahi hai 📥";
      try{v.play();}catch(e){}
      s.scrollIntoView({behavior:"smooth",block:"center"});
    };
  });
}
function offAsk(){try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}}
function offSaveBlob(name,blob,next){
  offAsk();
  oSave(name,blob,function(ok){
    $("offMsg").textContent=ok?"Save ho gaya: "+name+" ✅":"Save nahi hua. Jagah kam hai ya browser ne roka.";
    renderOff();
    if(next)next();
  });
}
$("offFile").addEventListener("change",function(){
  var files=Array.prototype.slice.call(this.files||[]),inp=this;
  var i=0;
  function nxt(){
    if(i>=files.length){inp.value="";return;}
    var f=files[i++];
    if(f.type&&f.type.indexOf("video")!==0){$("offMsg").textContent=f.name+" video file nahi hai.";nxt();return;}
    $("offMsg").textContent="Save ho raha hai: "+f.name+"...";
    offSaveBlob(f.name.replace(/\.[^.]+$/,""),f,nxt);
  }
  nxt();
});
function offFromUrl(){
  var url=$("offUrl").value.trim(),m=$("offMsg");
  if(!url){m.textContent="Pehle video ka seedha link daalo.";return;}
  if(/youtube\.com|youtu\.be/i.test(url)){m.textContent="YouTube videos save nahi ho sakte. Sirf apni ya licensed video ka seedha link daalo.";return;}
  m.textContent="Download ho raha hai...";
  fetch(url).then(function(r){
    if(!r.ok)throw new Error("http");
    var len=+r.headers.get("content-length")||0,ct=r.headers.get("content-type")||"video/mp4";
    if(!r.body||!r.body.getReader)return r.blob();
    var rd=r.body.getReader(),parts=[],got=0;
    function pump(){
      return rd.read().then(function(x){
        if(x.done)return new Blob(parts,{type:ct});
        parts.push(x.value);got+=x.value.length;
        m.textContent="Download ho raha hai... "+(len?Math.round(got*100/len)+"%":fmtSize(got));
        return pump();
      });
    }
    return pump();
  }).then(function(b){
    if(b.type&&b.type.indexOf("video")!==0&&!/\.(mp4|webm|mov|m4v|ogv)(\?|#|$)/i.test(url))throw new Error("type");
    var nm="Video";
    try{nm=decodeURIComponent(new URL(url).pathname.split("/").pop()||"Video").replace(/\.[^.]+$/,"")||"Video";}catch(e){}
    offSaveBlob(nm,b,function(){$("offUrl").value="";});
  }).catch(function(e){
    m.textContent=(e&&e.message==="type")?"Ye video file nahi lag rahi.":"Link se download nahi hua. Link galat hai ya server allow nahi karta. Video file device se chuno.";
  });
}
$("offGo").onclick=offFromUrl;
$("offUrl").addEventListener("keydown",function(e){if(e.key==="Enter")offFromUrl();});
window.addEventListener("pagehide",function(){if(offUrl){try{URL.revokeObjectURL(offUrl);}catch(e){}}});

window.addEventListener("online",netUi);
window.addEventListener("offline",function(){netUi();$("msg").textContent="Internet band hai. Neeche Offline Library se video chalao 📥";});
netUi();

if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
  window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});
}
