<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartoon Duniya</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#7fd6ff;--sun:#ffd23f;--pink:#ff6b9d;--grass:#5ed36b;--ink:#1b1b2f;--paper:#fffdf4;--card:#ffffff;--shadow:#1b1b2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#2a6fa8;--paper:#2b2850;--card:#3a3670;--ink:#fffdf4;--shadow:#000}}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Fredoka','Comic Sans MS',sans-serif;font-weight:500;color:var(--ink);background:var(--sky);
background-image:radial-gradient(rgba(255,255,255,.55) 3px,transparent 3.5px);background-size:28px 28px;min-height:100vh;overflow-x:hidden}
.cloud{position:fixed;width:120px;height:40px;background:#fff;border:4px solid #1b1b2f;border-radius:40px;opacity:.95;z-index:0;animation:drift 30s linear infinite}
.cloud::before{content:"";position:absolute;left:18px;top:-22px;width:50px;height:50px;background:#fff;border:4px solid #1b1b2f;border-radius:50%;border-bottom-color:transparent;border-right-color:transparent}
.c1{top:90px;left:-150px}.c2{top:260px;left:-150px;animation-duration:45s;animation-delay:-15s;transform:scale(.7)}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;padding:18px 0 10px}
h1{font-family:'Bangers','Impact',sans-serif;font-weight:400;font-size:clamp(48px,13vw,92px);letter-spacing:3px;margin:0;line-height:1;color:var(--sun);
-webkit-text-stroke:3px #1b1b2f;paint-order:stroke fill;text-shadow:5px 5px 0 #1b1b2f;display:inline-block;transform:rotate(-3deg);animation:pop 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(-3deg)}}
.tag{display:inline-block;margin-top:14px;background:var(--pink);color:#fff;border:4px solid #1b1b2f;border-radius:999px;padding:6px 18px;font-weight:700;box-shadow:4px 4px 0 var(--shadow);transform:rotate(2deg)}
.tv{margin:26px 0 8px;background:var(--card);border:5px solid #1b1b2f;border-radius:28px;padding:14px;box-shadow:9px 9px 0 var(--shadow)}
.tv[hidden],h2[hidden]{display:none}
.screen{position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#ffe27a 0 18px,#ffd23f 18px 36px);border:4px solid #1b1b2f;border-radius:18px;overflow:hidden;display:grid;place-items:center;text-align:center}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{padding:16px;font-family:'Bangers',sans-serif;font-size:clamp(22px,5vw,38px);letter-spacing:1.5px;color:#1b1b2f}
.empty span{display:block;font-size:64px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(8deg)}}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;font:inherit;padding:12px 16px;border:4px solid #1b1b2f;border-radius:999px;background:#fff;color:#1b1b2f}
input:focus-visible,button:focus-visible,a:focus-visible{outline:4px dashed var(--pink);outline-offset:3px}
.btn{font-family:'Bangers',sans-serif;font-size:22px;letter-spacing:1.5px;padding:10px 22px;border:4px solid #1b1b2f;border-radius:999px;background:var(--grass);color:#1b1b2f;cursor:pointer;box-shadow:4px 4px 0 var(--shadow);transition:transform .12s,box-shadow .12s;text-decoration:none;display:inline-block}
.btn[hidden]{display:none}
.btn:hover{transform:translate(-2px,-2px) rotate(-2deg);box-shadow:7px 7px 0 var(--shadow)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow)}
.msg{min-height:24px;margin:10px 4px 0;font-weight:700}
h2{font-family:'Bangers',sans-serif;font-weight:400;font-size:34px;letter-spacing:2px;margin:34px 0 14px;color:#fff;-webkit-text-stroke:2px #1b1b2f;paint-order:stroke fill;text-shadow:3px 3px 0 #1b1b2f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.pick{font-family:'Bangers',sans-serif;font-size:24px;letter-spacing:1.5px;text-align:center;color:#1b1b2f;text-decoration:none;padding:20px 8px;border:4px solid #1b1b2f;border-radius:22px;box-shadow:5px 5px 0 var(--shadow);transition:transform .15s}
.pick b{display:block;font-size:44px;font-weight:400;line-height:1.1}
.pick:hover{transform:rotate(-4deg) scale(1.06)}
.pick:nth-child(4n+1){background:#ffd23f}.pick:nth-child(4n+2){background:#ff9ec1}.pick:nth-child(4n+3){background:#9be7a1}.pick:nth-child(4n){background:#b9a6ff}
.hint{margin-top:30px;background:var(--card);border:4px dashed #1b1b2f;border-radius:20px;padding:14px 18px;font-size:15px}
.ground{position:fixed;left:0;right:0;bottom:0;height:22px;background:var(--grass);border-top:5px solid #1b1b2f;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vids{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.vid{font:inherit;text-align:left;padding:0;background:var(--card);color:var(--ink);border:4px solid #1b1b2f;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:5px 5px 0 var(--shadow);transition:transform .15s}
.vid:hover{transform:rotate(-2deg) scale(1.03)}
.vid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:4px solid #1b1b2f}
.vid span{display:block;padding:8px 12px;font-size:14px;font-weight:700}
summary{cursor:pointer;font-weight:700}
/* ===== YouTube-style player ===== */
.screen.has-player{background:#000}
.pl{position:absolute;inset:0;background:#000;color:#fff;user-select:none;-webkit-user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.pl iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.zone{position:absolute;top:0;bottom:0;width:50%;z-index:2}
.zl{left:0}.zr{right:0}
.ripple{position:absolute;top:50%;width:110px;height:110px;margin-top:-55px;border-radius:50%;background:rgba(255,255,255,.28);z-index:3;display:none;place-items:center;text-align:center;font-weight:700;font-size:15px;line-height:1.3;pointer-events:none}
.ripple.on{display:grid;animation:rp .6s ease-out both}
.rl{left:10%}.rr{right:10%}
@keyframes rp{0%{opacity:0;transform:scale(.6)}30%{opacity:1}100%{opacity:0;transform:scale(1.15)}}
.ctl{position:absolute;left:0;right:0;bottom:0;z-index:4;padding:30px 10px 6px;background:linear-gradient(transparent,rgba(0,0,0,.8));opacity:0;pointer-events:none;transition:opacity .2s}
.pl.show .ctl{opacity:1;pointer-events:auto}
.ctl .bar{display:flex;align-items:center;gap:2px}
.ctl button{background:none;border:0;color:#fff;padding:0;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;border-radius:50%;box-shadow:none;font:inherit}
.ctl button:hover{background:rgba(255,255,255,.18)}
.ctl button svg{width:28px;height:28px;fill:currentColor}
.ctl .time{font-size:13px;font-weight:700;white-space:nowrap;margin:0 8px}
.ctl .sp{flex:1}
.ctl input[type=range]{flex:none;display:block;width:100%;min-width:0;margin:0 0 4px;padding:0;border:0;border-radius:0;background:none;height:20px;accent-color:#f00;cursor:pointer}
.screen.fs{position:fixed;inset:0;z-index:9999;width:100vw;height:100vh;height:100dvh;aspect-ratio:auto;border:0;border-radius:0}
.screen.fs .ctl{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right));padding-bottom:max(8px,env(safe-area-inset-bottom))}
/* Fullscreen: kaali background, YouTube jaisa fit (16:9) aur pinch-out se zoom-to-fill */
.screen.fs,.screen:fullscreen,.screen:-webkit-full-screen{background:#000}
.screen.fs .pl{overflow:hidden;touch-action:none}
.screen.fs.fill .pl iframe{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%);
width:max(100vw,calc(100vh*16/9));height:max(100vh,calc(100vw*9/16));
width:max(100vw,calc(100dvh*16/9));height:max(100dvh,calc(100vw*9/16))}
body.fsmode{overflow:hidden}
body.fsmode .ground,body.fsmode .cloud{display:none}
/* ===== Side nav button + Favourite page ===== */
.sidenav{position:fixed;right:0;top:50%;transform:translateY(-50%);z-index:5;width:34px;height:64px;padding:0;display:grid;place-items:center;border:2px solid rgba(27,27,47,.35);border-right:0;border-radius:18px 0 0 18px;background:rgba(255,255,255,.28);color:#1b1b2f;font-size:22px;font-weight:700;line-height:1;cursor:pointer;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);opacity:.75;transition:opacity .15s,width .15s,background .15s;-webkit-tap-highlight-color:transparent}
.sidenav:hover,.sidenav:focus-visible{opacity:1;width:40px;background:rgba(255,255,255,.5)}
.sidenav[hidden]{display:none}
body.fsmode .sidenav{display:none}
.favpage{position:fixed;inset:0;z-index:9000;overflow-y:auto;background:var(--sky);background-image:radial-gradient(rgba(255,255,255,.55) 3px,transparent 3.5px);background-size:28px 28px;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.favpage[hidden]{display:none}
.favpage .wrap{padding-bottom:60px}
.favbar{display:flex;align-items:center;gap:12px;margin-top:8px}
.favbar h2{margin:0}
.favbar .btn{font-size:20px;padding:8px 18px}
.favbar{flex-wrap:wrap}
.btn.alt{background:var(--sun)}
/* ===== Favourite page: top bar (Back + Search) and bottom bar (History buttons) ===== */
.favpage .wrap{min-height:100%;display:flex;flex-direction:column;padding-bottom:12px}
.favtop{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:nowrap}
.favtop[hidden]{display:none}
.favtop .btn{flex:none;font-size:17px;padding:6px 14px;border-width:3px;box-shadow:3px 3px 0 var(--shadow);white-space:nowrap}
.favtop input{flex:1 1 0;min-width:0;padding:8px 14px;font-size:16px;border-width:3px}
.favtop #go{font-size:16px;padding:5px 12px}
.favfoot{margin-top:auto;position:sticky;bottom:0;z-index:2;display:flex;justify-content:center;align-items:center;gap:10px;flex-wrap:wrap;padding:22px 0 calc(8px + env(safe-area-inset-bottom,0px));background:linear-gradient(rgba(127,214,255,0),var(--sky) 45%)}
.favfoot .btn{font-size:17px;padding:6px 16px;border-width:3px;box-shadow:3px 3px 0 var(--shadow)}
.favfoot .btn[hidden]{display:none}
@media (max-width:380px){.favtop{gap:6px}.favtop .btn{padding:5px 10px;font-size:15px}.favtop #go{font-size:14px;padding:5px 9px}}
.subbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:34px}
.subbar h2{margin:0}
.subbar .btn{font-size:20px;padding:6px 16px}
.vid .when{font-size:12px;font-weight:500;padding-top:0;opacity:.75}
/* ===== Search + suggestions (favourite page) ===== */
.srow{margin-top:16px}
.sugList{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.sugList:empty{display:none}
.sugHead{font-family:'Bangers',sans-serif;font-size:22px;letter-spacing:1.5px;color:#fff;-webkit-text-stroke:1.5px #1b1b2f;paint-order:stroke fill;text-shadow:2px 2px 0 #1b1b2f;margin:6px 4px 0}
.sug{display:flex;align-items:center;background:var(--card);border:4px solid #1b1b2f;border-radius:999px;box-shadow:3px 3px 0 var(--shadow);overflow:hidden}
.sug .t{flex:1;min-width:0;display:flex;align-items:center;gap:10px;text-align:left;background:none;border:0;font:inherit;font-weight:700;color:var(--ink);padding:10px 8px 10px 16px;cursor:pointer}
.sug .t span.q{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sug .x{flex:none;width:44px;height:44px;background:none;border:0;border-left:3px solid rgba(27,27,47,.2);font:inherit;font-size:20px;font-weight:700;color:var(--ink);cursor:pointer}
.sug .x:hover{background:rgba(255,107,157,.35)}
.sug .t:focus-visible,.sug .x:focus-visible{outline:4px dashed var(--pink);outline-offset:-4px}
/* ===== Romantic photo show (home screen) ===== */
.love{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden;transition:opacity .7s}
.love.out{opacity:0}
.lv{position:absolute;will-change:transform,opacity;filter:drop-shadow(0 10px 16px rgba(255,64,129,.4))}
.lvin{position:relative;background:#fffafc;padding:8px 8px 30px;border:3px solid #ff6b9d;border-radius:14px;box-shadow:0 0 0 3px rgba(255,255,255,.75),0 0 26px rgba(255,107,157,.8)}
.lvin img,.lvin .ph{display:block;width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:8px;background:linear-gradient(135deg,#ffc2da,#ff6b9d)}
.lvin .ph{display:grid;place-items:center;font-size:48px}
.lvin::after{content:"\1F496";position:absolute;right:-13px;top:-16px;font-size:28px;animation:lvhb 1.1s ease-in-out infinite}
.lvin .cap{position:absolute;left:0;right:0;bottom:5px;text-align:center;font-size:14px;line-height:1;color:#ff3d7f;letter-spacing:5px}
@keyframes lvhb{0%,100%{transform:scale(1)}50%{transform:scale(1.3) rotate(8deg)}}
.lh{position:absolute;pointer-events:none;will-change:transform,opacity;line-height:1}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="wrap">
<header>
<h1>Cartoon Duniya!</h1><br>
<span class="tag">Chalo, cartoon dekhte hain 🎉</span>
</header>

<main>
<section class="tv" id="tvBox" aria-label="Cartoon player" hidden>
<div class="screen" id="screen">
<div class="empty"><span>📺</span>Side wale ‹ button se<br>cartoon dhundo!</div>
</div>
</section>
<p class="msg" id="msg" role="status"></p>

<h2 id="vidsHead" hidden>Videos</h2>
<div style="margin-bottom:14px"><button class="btn" id="again" type="button" hidden>🔄 Naye videos dikhao</button></div>
<div class="grid vids" id="res"></div>
</main>
</div>
<button class="sidenav" id="favBtn" type="button" aria-label="Apna favourite chuno kholo" title="Apna favourite chuno">&#8249;</button>
<div class="favpage" id="favPage" role="dialog" aria-modal="true" aria-label="Apna favourite chuno" hidden>
<div class="wrap">
<div class="favtop" id="favTop"><button class="btn" id="favBack" type="button">&larr; Wapas</button>
<input id="q" type="search" placeholder="Cartoon ka naam likho, jaise Tom and Jerry" aria-label="Cartoon search" autocomplete="off" autocapitalize="off" enterkeyhint="search">
<button class="btn" id="go" type="button">Dhundo!</button></div>
<div id="favMain">
<p class="msg" id="qMsg" role="status"></p>
<ul class="sugList" id="sugList" aria-label="Suggestions"></ul>
<div id="picksBox">
<h2>Apna favourite chuno</h2>
<div class="grid" id="picks"></div>
<p class="msg" id="sugMsg" role="status"></p>
</div>
</div>
<div id="qhBox" hidden>
<div class="favtop"><button class="btn" id="qhBack" type="button">&larr; Wapas</button></div>
<div class="subbar"><h2>Search History</h2></div>
<ul class="sugList" id="qhList" aria-label="Search history"></ul>
<p class="hint" id="qhEmpty" hidden>Abhi tak kuch search nahi kiya. Search karoge to yahan dikhega.</p>
</div>
<div id="histBox" hidden>
<div class="favtop"><button class="btn" id="histBack" type="button">&larr; Wapas</button></div>
<div class="subbar"><h2>History</h2></div>
<div class="grid vids" id="histGrid"></div>
</div>
<div class="favfoot"><button class="btn alt" id="histBtn" type="button">🕘 History</button><button class="btn alt" id="qhBtn" type="button">🔎 Search History</button></div>
</div>
</div>
<div class="ground"></div>

<script>
var picks=[["🐭","Tom and Jerry"],["🤖","Doraemon"],["🦸","Shin Chan"],["🐘","Chhota Bheem"],["🐻","Motu Patlu"],["🧽","SpongeBob"],["🐱","Oggy"],["🚀","Ninja Hattori"]];
var KEY="AIzaSyDudljWyHUaPhUW1Ux3NeSHZQkRU1fVFcc";
var $=function(i){return document.getElementById(i)};
var g=$("picks");
function renderPicks(list){
  g.innerHTML="";
  list.forEach(function(p){
    var b=document.createElement("button");b.type="button";b.className="pick";
    b.style.font="inherit";b.style.cursor="pointer";b.style.fontFamily="'Bangers',sans-serif";
    var ic=document.createElement("b");ic.textContent=p[0];
    b.appendChild(ic);b.appendChild(document.createTextNode(p[1]));
    b.onclick=function(){$("q").value=p[1];closeFav();search();};
    g.appendChild(b);
  });
}
renderPicks(picks);
/* ===== Har baar naye videos ===== */
var ORD=["relevance","viewCount","rating","relevance"];
var SUF=["cartoon","cartoon full episode","cartoon hindi","cartoon new episode","cartoon funny moments","cartoon compilation","cartoon episodes"];
var SEEN_KEY="cd_seen",reqId=0;
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a}
function getSeen(){try{return JSON.parse(localStorage.getItem(SEEN_KEY)||"[]")}catch(e){return[]}}
function addSeen(ids){try{var s=getSeen().filter(function(x){return ids.indexOf(x)<0}).concat(ids).slice(-400);localStorage.setItem(SEEN_KEY,JSON.stringify(s));}catch(e){}}
function search(plain){
  plain=(plain===true);
  var q=$("q").value.trim(),msg=$("msg"),res=$("res");
  if(!q){msg.textContent="Pehle cartoon ka naam likho.";return;}
  msg.textContent="Dhund rahe hain...";
  var my=++reqId;
  var term=plain?q+" cartoon":q+" "+rnd(SUF);
  var u="https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&safeSearch=strict&maxResults=50&order="+(plain?"relevance":rnd(ORD))+"&q="+encodeURIComponent(term)+"&key="+encodeURIComponent(KEY);
  fetch(u).then(function(r){return r.json()}).then(function(d){
    if(my!==reqId)return;
    if(d.error){msg.textContent="API error: "+d.error.message;return;}
    var items=(d.items||[]).filter(function(it){return it.id&&it.id.videoId});
    if(!items.length&&!plain){search(true);return;}
    var seen=getSeen();
    var fresh=shuffle(items.filter(function(it){return seen.indexOf(it.id.videoId)<0}));
    var old=shuffle(items.filter(function(it){return seen.indexOf(it.id.videoId)>=0}));
    var show=shuffle(fresh.concat(old).slice(0,12));
    res.innerHTML="";
    show.forEach(function(it){
      var b=document.createElement("button");b.type="button";b.className="vid";
      var th=it.snippet.thumbnails||{};
      var im=document.createElement("img");im.src=(th.medium||th.default||{}).url||"";im.alt="";
      var t=document.createElement("span");t.textContent=it.snippet.title;
      b.appendChild(im);b.appendChild(t);
      b.onclick=function(){playVid(it.id.videoId,it.snippet.title);};
      res.appendChild(b);
    });
    addSeen(show.map(function(it){return it.id.videoId}));
    $("again").hidden=!show.length;
    $("vidsHead").hidden=!show.length;
    msg.textContent=show.length?"Koi bhi video chuno!":"Kuch nahi mila, doosra naam try karo.";
  }).catch(function(){msg.textContent="Network error. Page apni site par host karke kholo.";});
}

/* ===== YouTube jaisa player ===== */
function svg(p){return '<svg viewBox="0 0 24 24" aria-hidden="true">'+p+'</svg>'}
var RP="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6s-2.69 6-6 6-6-2.69-6-6H4c0 4.42 3.58 8 8 8s8-3.58 8-8-3.58-8-8-8z";
var TX='<text x="12" y="15.6" font-size="7" text-anchor="middle" font-weight="700" style="font-family:Arial,sans-serif">10</text>';
var IC={
  play:svg('<path d="M8 5v14l11-7z"/>'),
  pause:svg('<path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>'),
  back:svg('<path d="'+RP+'"/>'+TX),
  fwd:svg('<path transform="translate(24 0) scale(-1 1)" d="'+RP+'"/>'+TX),

  mute:svg('<path d="M16.5 12A4.5 4.5 0 0 0 14 7.97v2.21l2.45 2.45c.03-.2.05-.41.05-.63zm2.5 0c0 .94-.2 1.82-.54 2.64l1.51 1.51A8.8 8.8 0 0 0 21 12c0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zM4.27 3L3 4.27 7.73 9H3v6h4l5 5v-6.73l4.25 4.25c-.67.52-1.42.93-2.25 1.18v2.06a8.99 8.99 0 0 0 3.69-1.81L19.73 21 21 19.73l-9-9L4.27 3zM12 4L9.91 6.09 12 8.18V4z"/>'),

];
var MAX_VIS=4,alive=true,timers=[],vis=[],lastIdx=-1;
var HEARTS=["💕","💖","💗","❤️","💘","💞"];
var reduce=false;try{reduce=window.matchMedia("(prefers-reduced-motion:reduce)").matches}catch(e){}
var layer=document.createElement("div");layer.className="love";layer.setAttribute("aria-hidden","true");
document.body.appendChild(layer);
function R(a,b){return a+Math.random()*(b-a)}
function later(fn,ms){var t=setTimeout(function(){var k=timers.indexOf(t);if(k>=0)timers.splice(k,1);if(alive)fn();},ms);timers.push(t);return t}
function pickIdx(){
  var ok=[],i;
  for(i=0;i<LOVE_PICS.length;i++){if(i!==lastIdx&&vis.indexOf(i)<0)ok.push(i);}
  return ok.length?ok[Math.floor(Math.random()*ok.length)]:-1;
}
function floatHeart(x,y,big){
  if(reduce||!alive||!layer.animate)return;
  var h=document.createElement("span");h.className="lh";
  h.textContent=HEARTS[Math.floor(Math.random()*HEARTS.length)];
  h.style.left=x+"px";h.style.top=y+"px";h.style.fontSize=Math.round(R(14,big?34:26))+"px";
  h.style.zIndex=Math.floor(R(1,60));
  layer.appendChild(h);
  var dx=R(-50,50),dy=-R(140,300);
  var a=h.animate([
    {transform:"translate(0,0) scale(.4) rotate(0deg)",opacity:0},
    {transform:"translate("+dx*.3+"px,"+dy*.25+"px) scale(1) rotate("+R(-15,15)+"deg)",opacity:.95,offset:.2},
    {transform:"translate("+dx+"px,"+dy+"px) scale(1.15) rotate("+R(-30,30)+"deg)",opacity:0}
  ],{duration:R(2600,4200),easing:"ease-out",fill:"forwards"});
  a.onfinish=function(){if(h.parentNode)h.parentNode.removeChild(h);};
}
function placeholder(i){
  var d=document.createElement("div");d.className="ph";d.textContent="💕";return d;
}
function showPhoto(i){
  lastIdx=i;vis.push(i);
  var vw=window.innerWidth,vh=window.innerHeight;
  var w=Math.round(Math.min(vw*R(.34,.5),R(135,215)));
  var h=Math.round(w*4/3+38);
  var el=document.createElement("div");el.className="lv";el.style.width=w+"px";
  var inn=document.createElement("div");inn.className="lvin";
  var url=LOVE_PICS[i];
  if(url){
    var im=new Image();im.alt="";im.draggable=false;
    im.onerror=function(){if(im.parentNode){inn.replaceChild(placeholder(i),im);}};
    im.src=url;inn.appendChild(im);
  }else inn.appendChild(placeholder(i));
  var cap=document.createElement("div");cap.className="cap";cap.textContent="❤ ❤ ❤";inn.appendChild(cap);
  el.appendChild(inn);
  var left=R(6,Math.max(7,vw-w-6));
  var top=R(vh*.1,Math.max(vh*.1+1,vh-h-40));
  el.style.left=Math.round(left)+"px";el.style.top=Math.round(top)+"px";
  el.style.zIndex=String(Math.floor(R(1,60)));   /* random: kabhi aage, kabhi peeche */
  var rot=R(-14,14);
  layer.appendChild(el);
  var fin="translateX(0) rotate("+rot+"deg) scale(1)";
  var enter;
  if(!el.animate||reduce){el.style.opacity="1";el.style.transform=fin;enter=null;}
  else{
    enter=el.animate([
      {transform:"translateX("+(vw-left+60)+"px) translateY("+R(-60,60)+"px) rotate("+(rot+35)+"deg) scale(.45)",opacity:0},
      {transform:"translateX(-16px) translateY(-6px) rotate("+(rot-5)+"deg) scale(1.07)",opacity:1,offset:.62},
      {transform:fin,opacity:1}
    ],{duration:1500,easing:"cubic-bezier(.22,.8,.3,1)",fill:"forwards"});
  }
  var landed=function(){
    if(!alive)return;
    var cx=left+w/2,cy=top+h/2,n;
    for(n=0;n<6;n++)(function(k){later(function(){floatHeart(cx+R(-w/2,w/2),cy+R(-h/4,h/3),true)},k*140)})(n);
    if(inn.animate&&!reduce){
      inn.animate([{transform:"translateY(0) scale(1)"},{transform:"translateY(-7px) scale(1.025)"},{transform:"translateY(0) scale(1)"}],
        {duration:R(2600,3800),iterations:Infinity,easing:"ease-in-out"});
    }
  };
  if(enter)enter.onfinish=landed;else landed();
  later(function(){leave(el,i,fin,rot,left,w)},R(5800,8800));
}
function leave(el,i,fin,rot,left,w){
  function done(){if(el.parentNode)el.parentNode.removeChild(el);var k=vis.indexOf(i);if(k>=0)vis.splice(k,1);}
  if(!el.animate||reduce){done();return;}
  var toLeft=Math.random()<.5;
  var end=toLeft
    ?"translateX("+(-(left+w+80))+"px) translateY("+R(-40,40)+"px) rotate("+(rot-25)+"deg) scale(.6)"
    :"translateY("+(-R(50,110))+"px) rotate("+(rot+R(-10,10))+"deg) scale(1.15)";
  var a=el.animate([{transform:fin,opacity:1},{transform:end,opacity:0}],{duration:1500,easing:"ease-in",fill:"forwards"});
  a.onfinish=done;
}
function spawn(){
  if(!alive)return;
  if(vis.length<MAX_VIS){var i=pickIdx();if(i>=0)showPhoto(i);}
  later(spawn,R(1500,2900));
}
function ambient(){
  if(!alive)return;
  floatHeart(R(10,Math.max(11,window.innerWidth-30)),window.innerHeight-R(10,60),false);
  later(ambient,R(500,1100));
}
window.stopLove=function(){
  if(!alive)return;
  alive=false;
  timers.forEach(clearTimeout);timers=[];
  layer.classList.add("out");
  setTimeout(function(){if(layer.parentNode)layer.parentNode.removeChild(layer);},800);
};
/* Cartoon wala koi bhi feature use ho (search / video play) -> photo show hat jaye */
["search","playVid"].forEach(function(n){
  var f=window[n];if(typeof f!=="function")return;
  window[n]=function(){window.stopLove();return f.apply(this,arguments);};
});
later(spawn,500);
later(ambient,900);
})();
</script>
</body>
</html>
