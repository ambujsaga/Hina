<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cartoon Duniya</title>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Fredoka:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky:#7fd6ff;--sun:#ffd23f;--pink:#ff6b9d;--grass:#5ed36b;--ink:#1b1b2f;--paper:#fffdf4;--card:#ffffff;--shadow:#1b1b2f}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sky:#2a6fa8;--paper:#2b2850;--card:#3a3670;--ink:#fffdf4;--shadow:#000}}
*{box-sizing:border-box}
html,body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{font-family:'Fredoka','Comic Sans MS',sans-serif;font-weight:500;color:var(--ink);background:var(--sky);
background-image:radial-gradient(rgba(255,255,255,.55) 3px,transparent 3.5px);background-size:28px 28px;min-height:100vh;overflow-x:hidden}
.cloud{position:fixed;width:120px;height:40px;background:#fff;border:4px solid #1b1b2f;border-radius:40px;opacity:.95;z-index:0;animation:drift 30s linear infinite}
.cloud::before{content:"";position:absolute;left:18px;top:-22px;width:50px;height:50px;background:#fff;border:4px solid #1b1b2f;border-radius:50%;border-bottom-color:transparent;border-right-color:transparent}
.c1{top:90px;left:-150px}.c2{top:260px;left:-150px;animation-duration:45s;animation-delay:-15s;transform:scale(.7)}
@keyframes drift{to{transform:translateX(calc(100vw + 300px))}}
.wrap{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:20px 16px 60px}
header{text-align:center;padding:18px 0 10px}
h1{font-family:'Bangers','Impact',sans-serif;font-weight:400;font-size:clamp(48px,13vw,92px);letter-spacing:3px;margin:0;line-height:1;color:var(--sun);
-webkit-text-stroke:3px #1b1b2f;paint-order:stroke fill;text-shadow:5px 5px 0 #1b1b2f;display:inline-block;transform:rotate(-3deg);animation:pop 1.1s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-20deg)}100%{transform:scale(1) rotate(-3deg)}}
.tag{display:inline-block;margin-top:14px;background:var(--pink);color:#fff;border:4px solid #1b1b2f;border-radius:999px;padding:6px 18px;font-weight:700;box-shadow:4px 4px 0 var(--shadow);transform:rotate(2deg)}
.tv{margin:26px 0 8px;background:var(--card);border:5px solid #1b1b2f;border-radius:28px;padding:14px;box-shadow:9px 9px 0 var(--shadow)}
.screen{position:relative;aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#ffe27a 0 18px,#ffd23f 18px 36px);border:4px solid #1b1b2f;border-radius:18px;overflow:hidden;display:grid;place-items:center;text-align:center}
.screen iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.empty{padding:16px;font-family:'Bangers',sans-serif;font-size:clamp(22px,5vw,38px);letter-spacing:1.5px;color:#1b1b2f}
.empty span{display:block;font-size:64px;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px) rotate(8deg)}}
.row{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
input{flex:1 1 220px;min-width:0;font:inherit;padding:12px 16px;border:4px solid #1b1b2f;border-radius:999px;background:#fff;color:#1b1b2f}
input:focus-visible,button:focus-visible,a:focus-visible{outline:4px dashed var(--pink);outline-offset:3px}
.btn{font-family:'Bangers',sans-serif;font-size:22px;letter-spacing:1.5px;padding:10px 22px;border:4px solid #1b1b2f;border-radius:999px;background:var(--grass);color:#1b1b2f;cursor:pointer;box-shadow:4px 4px 0 var(--shadow);transition:transform .12s,box-shadow .12s;text-decoration:none;display:inline-block}
.btn[hidden]{display:none}
.btn:hover{transform:translate(-2px,-2px) rotate(-2deg);box-shadow:7px 7px 0 var(--shadow)}
.btn:active{transform:translate(4px,4px);box-shadow:0 0 0 var(--shadow)}
.msg{min-height:24px;margin:10px 4px 0;font-weight:700}
h2{font-family:'Bangers',sans-serif;font-weight:400;font-size:34px;letter-spacing:2px;margin:34px 0 14px;color:#fff;-webkit-text-stroke:2px #1b1b2f;paint-order:stroke fill;text-shadow:3px 3px 0 #1b1b2f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.pick{font-family:'Bangers',sans-serif;font-size:24px;letter-spacing:1.5px;text-align:center;color:#1b1b2f;text-decoration:none;padding:20px 8px;border:4px solid #1b1b2f;border-radius:22px;box-shadow:5px 5px 0 var(--shadow);transition:transform .15s}
.pick b{display:block;font-size:44px;font-weight:400;line-height:1.1}
.pick:hover{transform:rotate(-4deg) scale(1.06)}
.pick:nth-child(4n+1){background:#ffd23f}.pick:nth-child(4n+2){background:#ff9ec1}.pick:nth-child(4n+3){background:#9be7a1}.pick:nth-child(4n){background:#b9a6ff}
.hint{margin-top:30px;background:var(--card);border:4px dashed #1b1b2f;border-radius:20px;padding:14px 18px;font-size:15px}
.ground{position:fixed;left:0;right:0;bottom:0;height:22px;background:var(--grass);border-top:5px solid #1b1b2f;z-index:2}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vids{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.vid{font:inherit;text-align:left;padding:0;background:var(--card);color:var(--ink);border:4px solid #1b1b2f;border-radius:18px;overflow:hidden;cursor:pointer;box-shadow:5px 5px 0 var(--shadow);transition:transform .15s}
.vid:hover{transform:rotate(-2deg) scale(1.03)}
.vid img{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-bottom:4px solid #1b1b2f}
.vid span{display:block;padding:8px 12px;font-size:14px;font-weight:700}
summary{cursor:pointer;font-weight:700}
.th{position:relative}
.vid em{position:absolute;right:6px;bottom:6px;background:rgba(0,0,0,.82);color:#fff;font:700 12px Fredoka,sans-serif;font-style:normal;border-radius:6px;padding:1px 6px}
.vid small{display:block;padding:0 12px 10px;font-size:12px;opacity:.75}
.vwrap{position:absolute;inset:0;background:#000;transition:transform .45s ease}
.tap{position:absolute;inset:0;z-index:2;cursor:pointer;touch-action:manipulation}
.rip{position:absolute;top:42%;padding:10px 16px;border-radius:999px;background:rgba(0,0,0,.65);color:#fff;font-weight:700;opacity:0;pointer-events:none;transition:opacity .15s}
.rip.l{left:8%}.rip.r{right:8%}.rip.go{opacity:1}
.ctl{position:absolute;left:0;right:0;bottom:0;z-index:3;padding:22px 8px 6px;background:linear-gradient(transparent,rgba(0,0,0,.78));color:#fff;text-align:left;transition:opacity .25s}
.screen.hid .ctl{opacity:0;pointer-events:none}.screen.hid{cursor:none}
.ctl input{flex:none;width:100%;min-width:0;padding:0;border:0;border-radius:0;background:none;accent-color:var(--pink);height:16px;margin:0}
.cb{display:flex;align-items:center;gap:4px;flex-wrap:wrap}
.cb button{font:700 14px Fredoka,sans-serif;background:rgba(0,0,0,.4);color:#fff;border:2px solid #fff;border-radius:999px;padding:2px 9px;min-height:30px;cursor:pointer}
.cb button.on{background:var(--pink)}
.cb #vol{width:64px}.cb #tm{font-size:13px;margin-left:4px}.sp{flex:1}
@media (max-width:560px){.cb #vol{display:none}}
.screen:fullscreen,.screen.pfs{aspect-ratio:auto;border-radius:0;border:0}
.screen:-webkit-full-screen{aspect-ratio:auto;border-radius:0;border:0}
.screen.pfs{position:fixed;inset:0;z-index:50}
.info{margin-top:14px;padding:10px 14px;background:var(--card);border:4px solid #1b1b2f;border-radius:18px}
.info h3{margin:0 0 4px;font-size:18px}.info p{margin:0 0 8px;font-size:13px;opacity:.8}
.chip{font:inherit;font-weight:700;font-size:14px;border:3px solid #1b1b2f;border-radius:999px;padding:4px 12px;background:var(--sun);color:#1b1b2f;cursor:pointer;margin:0 6px 6px 0}
.chip.on{background:var(--pink);color:#fff}
</style>
</head>
<body>
<div class="cloud c1"></div><div class="cloud c2"></div>
<div class="wrap">
<header>
<h1>Cartoon Duniya!</h1><br>
<span class="tag">Chalo, cartoon dekhte hain 🎉</span>
</header>

<main>
<section class="tv" aria-label="Cartoon player">
<div class="screen" id="screen">
<div class="empty"><span>📺</span>Cartoon ka naam likho<br>aur Dhundo dabao!</div>
</div>
<div id="info" class="info" hidden></div>
<div class="row">
<input id="q" type="search" placeholder="Cartoon ka naam likho, jaise Tom and Jerry" aria-label="Cartoon search">
<button class="btn" id="go" type="button">Dhundo!</button>
</div>
<p class="msg" id="msg" role="status"></p>
<a class="btn" id="watch" href="#" target="_blank" rel="noopener" hidden>YouTube par dekho</a>
</section>

<h2>Apna favourite chuno</h2>
<div class="grid" id="picks"></div>

<h2>Videos</h2>
<div class="grid vids" id="res"></div>
<div style="text-align:center;margin-top:18px"><button class="btn" id="more" type="button" hidden>Aur naye videos 🔄</button></div>
<h2 id="hh" hidden>Pehle dekhe hue</h2>
<div class="grid vids" id="hist"></div>
</main>
</div>
<div class="ground"></div>

<script>
var picks=[["🐭","Tom and Jerry"],["🤖","Doraemon"],["🦸","Shin Chan"],["🐘","Chhota Bheem"],["🐻","Motu Patlu"],["🧽","SpongeBob"],["🐱","Oggy"],["🚀","Ninja Hattori"]];
var KEY="AIzaSyDudljWyHUaPhUW1Ux3NeSHZQkRU1fVFcc";
var $=function(i){return document.getElementById(i)};
var g=$("picks");
picks.forEach(function(p){
  var b=document.createElement("button");b.type="button";b.className="pick";
  b.style.font="inherit";b.style.cursor="pointer";b.style.fontFamily="'Bangers',sans-serif";
  b.innerHTML="<b>"+p[0]+"</b>"+p[1];
  b.onclick=function(){$("q").value=p[1];search();};
  g.appendChild(b);
});
function ls(k,d){try{var x=JSON.parse(localStorage.getItem(k));return x==null?d:x}catch(e){return d}}
function sv(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function rnd(a){return a[Math.floor(Math.random()*a.length)]}
function shuf(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function p2(n){return n<10?"0"+n:""+n}
function fmt(t){t=Math.floor(t||0);var h=Math.floor(t/3600),m=Math.floor(t%3600/60),s=t%60;return h?h+":"+p2(m)+":"+p2(s):m+":"+p2(s)}
function isoD(s){var m=/PT(?:(\d+)H)?(?:(\d+)M)?(?:(\d+)S)?/.exec(s||"");return m?fmt((+m[1]||0)*3600+(+m[2]||0)*60+(+m[3]||0)):""}
function vw(n){n=+n;return n?(n>=1e6?(n/1e6).toFixed(1)+"M":n>=1e3?Math.round(n/1e3)+"K":n)+" views":""}
var tx=document.createElement("textarea");function dec(s){tx.innerHTML=s||"";return tx.value}
var MODS=["","full episode","new episode","funny","hindi","latest","best moments","compilation","superhit","for kids","classic"],ORD=["relevance","date","viewCount","rating","relevance"],SP=[.5,.75,1,1.25,1.5,2];
var list=[],lastQ="",pn=false,seen=ls("cd_seen",[]),hist=ls("cd_hist",[]),pos=ls("cd_pos",{}),autoNext=ls("cd_auto",true);
var P=null,ready=false,fb=false,pend=null,cur=null,rot=0,loop=false,drag=false,tick=null,hideT,tapT=0,tapN,rT,lastSave=0;

/* ---- Search: har baar naye/random videos (purane dobara nahi) ---- */
function search(more,term){
  more=(more===true);
  var q=(term||$("q").value).trim(),msg=$("msg"),res=$("res");
  if(!q){msg.textContent="Pehle cartoon ka naam likho.";return;}
  lastQ=q;msg.textContent="Dhund rahe hain...";
  var u="https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&videoEmbeddable=true&safeSearch=strict&maxResults=25&order="+rnd(ORD)+"&q="+encodeURIComponent((q+" cartoon "+rnd(MODS)).trim())+"&key="+encodeURIComponent(KEY);
  fetch(u).then(function(r){return r.json()}).then(function(d){
    if(d.error){pn=false;msg.textContent="API error: "+d.error.message;return;}
    var its=(d.items||[]).filter(function(it){return it.id&&it.id.videoId});
    var fresh=its.filter(function(it){return seen.indexOf(it.id.videoId)<0});
    if(fresh.length<6)fresh=its;
    fresh=shuf(fresh).slice(0,12);
    var ids=fresh.map(function(it){return it.id.videoId});
    var du="https://www.googleapis.com/youtube/v3/videos?part=contentDetails,statistics&id="+ids.join(",")+"&key="+encodeURIComponent(KEY);
    return (ids.length?fetch(du).then(function(r){return r.json()}):Promise.resolve({})).catch(function(){return{}}).then(function(dd){
      var m={};(dd.items||[]).forEach(function(x){m[x.id]=x});
      var vs=fresh.map(function(it){var x=m[it.id.videoId]||{};return{id:it.id.videoId,t:it.snippet.title,im:it.snippet.thumbnails.medium.url,ch:it.snippet.channelTitle,d:x.contentDetails?isoD(x.contentDetails.duration):"",v:x.statistics?vw(x.statistics.viewCount):""}});
      seen=seen.concat(ids).slice(-300);sv("cd_seen",seen);
      if(!more){res.innerHTML="";list=[];}
      vs.forEach(function(v){list.push(v);res.appendChild(card(v));});
      $("more").hidden=!list.length;
      msg.textContent=vs.length?"Koi bhi video chuno!":"Kuch nahi mila, doosra naam try karo.";
      if(pn&&vs.length){pn=false;playVid(vs[0].id,vs[0]);}
    });
  }).catch(function(){msg.textContent="Network error. Page apni site par host karke kholo.";});
}
function card(v){
  var b=document.createElement("button");b.type="button";b.className="vid";
  var th=document.createElement("div");th.className="th";
  var im=document.createElement("img");im.src=v.im;im.alt="";im.loading="lazy";th.appendChild(im);
  if(v.d&&v.d!=="0:00"){var e=document.createElement("em");e.textContent=v.d;th.appendChild(e);}
  var t=document.createElement("span");t.textContent=dec(v.t);
  var m=document.createElement("small");m.textContent=dec(v.ch)+(v.v?" • "+v.v:"");
  b.appendChild(th);b.appendChild(t);b.appendChild(m);
  b.onclick=function(){playVid(v.id,v);};
  return b;
}
function rh(){var h=$("hist");h.innerHTML="";hist.forEach(function(v){h.appendChild(card(v))});$("hh").hidden=!hist.length;}
function addH(v){hist=hist.filter(function(x){return x.id!==v.id});hist.unshift(v);hist=hist.slice(0,12);sv("cd_hist",hist);rh();}

/* ---- Player (YouTube jaisa) ---- */
function plain(id){
  var o="";try{if(location.protocol.indexOf("http")===0)o="&origin="+encodeURIComponent(location.origin);}catch(e){}
  $("screen").innerHTML='<iframe src="https://www.youtube.com/embed/'+id+'?autoplay=1&rel=0&playsinline=1'+o+'" title="Cartoon" referrerpolicy="strict-origin-when-cross-origin" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen></iframe>';
}
function find(id){var r=list.concat(hist).filter(function(x){return x.id===id})[0];return r||{id:id,t:"Cartoon",im:"https://i.ytimg.com/vi/"+id+"/mqdefault.jpg",ch:"",d:"",v:""};}
function resume(id){return pos[id]>10?pos[id]:0;}
function playVid(id,v){
  cur=v||find(id);pend=id;
  if(fb)plain(id);
  else if(ready)P.loadVideoById({videoId:id,startSeconds:resume(id)});
  else if(!$("vwrap"))build();
  addH(cur);info();
  $("watch").href="https://www.youtube.com/watch?v="+id;$("watch").hidden=false;
  $("screen").scrollIntoView({behavior:"smooth",block:"center"});
  $("msg").textContent="Maza karo! 🍿";
}
function build(){
  $("screen").innerHTML='<div class="vwrap" id="vwrap"><div id="yt"></div></div><div class="tap" id="tap"><b class="rip" id="rip"></b></div><div class="ctl" id="ctl"><input id="sk" type="range" min="0" max="1000" value="0" aria-label="Seek"><div class="cb"><button id="bpp" type="button" title="Play/Pause (k)">▶</button><button id="bb" type="button" title="10 sec peeche (j)">⏪ 10</button><button id="bf" type="button" title="10 sec aage (l)">10 ⏩</button><button id="bn" type="button" title="Agla (Shift+N)">⏭</button><button id="bm" type="button" title="Mute (m)">🔊</button><input id="vol" type="range" min="0" max="100" value="100" aria-label="Volume"><span id="tm">0:00 / 0:00</span><span class="sp"></span><button id="bl" type="button" title="Loop">🔁</button><button id="bs" type="button" title="Speed (< >)">1x</button><button id="br" type="button" title="180° ghumao (r)">🔄 180°</button><button id="bfs" type="button" title="Fullscreen (f)">⛶</button></div></div>';
  wire();
  if(window.YT&&YT.Player)mk();
  else{window.onYouTubeIframeAPIReady=mk;var s=document.createElement("script");s.src="https://www.youtube.com/iframe_api";s.onerror=function(){fb=true;plain(pend);};document.head.appendChild(s);}
}
function mk(){
  var pv={autoplay:1,controls:0,rel:0,playsinline:1,modestbranding:1,fs:0,iv_load_policy:3,disablekb:1,start:resume(pend)};
  try{if(location.protocol.indexOf("http")===0)pv.origin=location.origin;}catch(e){}
  P=new YT.Player("yt",{width:"100%",height:"100%",videoId:pend,playerVars:pv,events:{
    onReady:function(){ready=true;if(P.getVideoData().video_id!==pend)P.loadVideoById(pend);P.playVideo();mu();showC();},
    onStateChange:st,
    onError:function(){$("msg").textContent="Ye video yahan nahi chal sakta 😕 'YouTube par dekho' dabao.";if(autoNext)setTimeout(function(){nxt(1)},2500);}
  }});
}
function st(e){
  var s=e.data;$("bpp").textContent=s===1?"⏸":"▶";
  if(s===1){if(!tick)tick=setInterval(upd,250);}else if(s!==3){clearInterval(tick);tick=null;upd();showC();}
  if(s===0){if(loop){P.seekTo(0,true);P.playVideo();}else if(autoNext)nxt(1);}
}
function upd(){
  if(!ready)return;var t=P.getCurrentTime(),d=P.getDuration();
  if(!drag&&d)$("sk").value=t/d*1000;
  $("tm").textContent=fmt(t)+" / "+fmt(d);
  if(cur&&Date.now()-lastSave>5000){lastSave=Date.now();pos[cur.id]=(d&&t>d-15)?0:Math.floor(t);sv("cd_pos",pos);}
}
function tog(){if(!ready)return;if(P.getPlayerState()===1)P.pauseVideo();else P.playVideo();}
function skip(s){if(!ready)return;var d=P.getDuration()||1e9;P.seekTo(Math.max(0,Math.min(P.getCurrentTime()+s,d)),true);upd();}
function rip(t,side){var r=$("rip");if(!r)return;r.textContent=t;r.className="rip "+side+" go";clearTimeout(rT);rT=setTimeout(function(){r.className="rip"},600);}
function sk10(s){skip(s);rip(s<0?"⏪ 10 sec":"10 sec ⏩",s<0?"l":"r");}
function rotate180(){rot=rot?0:180;$("vwrap").style.transform="rotate("+rot+"deg)";$("br").classList.toggle("on",!!rot);}
function spd(d){if(!ready)return;var i=SP.indexOf(P.getPlaybackRate());i=(i<0?2:i+d+SP.length)%SP.length;P.setPlaybackRate(SP[i]);$("bs").textContent=SP[i]+"x";}
function mu(){if(ready)$("bm").textContent=(P.isMuted()||!P.getVolume())?"🔇":"🔊";}
function fs(){var s=$("screen"),d=document;if(d.fullscreenElement||d.webkitFullscreenElement){(d.exitFullscreen||d.webkitExitFullscreen).call(d);}else if(s.requestFullscreen)s.requestFullscreen();else if(s.webkitRequestFullscreen)s.webkitRequestFullscreen();else s.classList.toggle("pfs");}
function showC(){var s=$("screen");s.classList.remove("hid");clearTimeout(hideT);hideT=setTimeout(function(){if(ready&&P.getPlayerState()===1)s.classList.add("hid");},3000);}
function nxt(d){
  var i=-1;list.forEach(function(x,k){if(cur&&x.id===cur.id)i=k;});
  var n=list[i+d];
  if(n)playVid(n.id,n);
  else if(d>0&&lastQ){pn=true;search(true,lastQ);}
}
function wire(){
  $("bpp").onclick=tog;$("bb").onclick=function(){sk10(-10)};$("bf").onclick=function(){sk10(10)};$("bn").onclick=function(){nxt(1)};
  $("bm").onclick=function(){if(!ready)return;if(P.isMuted())P.unMute();else P.mute();mu();};
  $("vol").oninput=function(){if(!ready)return;P.setVolume(+this.value);if(+this.value&&P.isMuted())P.unMute();mu();};
  $("bl").onclick=function(){loop=!loop;this.classList.toggle("on",loop);};
  $("bs").onclick=function(){spd(1)};$("br").onclick=rotate180;$("bfs").onclick=fs;
  var s=$("sk");
  s.oninput=function(){if(!ready)return;drag=true;var d=P.getDuration();$("tm").textContent=fmt(this.value/1000*d)+" / "+fmt(d);};
  s.onchange=function(){if(ready)P.seekTo(this.value/1000*P.getDuration(),true);drag=false;};
  $("tap").onclick=function(e){
    var r=this.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,now=Date.now();
    if(now-tapT<300){clearTimeout(tapN);tapT=0;if(x<.33)sk10(-10);else if(x>.67)sk10(10);else fs();}
    else{tapT=now;tapN=setTimeout(function(){tog();showC();},300);}
  };
  var sc=$("screen");sc.onmousemove=sc.ontouchstart=showC;
}
document.addEventListener("keydown",function(e){
  if(!ready||e.ctrlKey||e.metaKey||e.altKey)return;
  var tg=e.target.tagName,k=e.key,ok=true;
  if(tg==="TEXTAREA"||(tg==="INPUT"&&e.target.type!=="range")||(tg==="BUTTON"&&(k===" "||k==="Enter")))return;
  if(k===" "||k==="k")tog();else if(k==="j")sk10(-10);else if(k==="l")sk10(10);
  else if(k==="ArrowLeft")skip(-5);else if(k==="ArrowRight")skip(5);
  else if(k==="ArrowUp"||k==="ArrowDown"){var v=Math.max(0,Math.min(100,P.getVolume()+(k==="ArrowUp"?10:-10)));P.setVolume(v);$("vol").value=v;mu();}
  else if(k==="m")$("bm").click();else if(k==="f")fs();else if(k==="r")rotate180();
  else if(k===">")spd(1);else if(k==="<")spd(-1);else if(k==="N")nxt(1);
  else if(k==="Escape")$("screen").classList.remove("pfs");
  else if(/^[0-9]$/.test(k))P.seekTo((P.getDuration()||0)*k/10,true);
  else ok=false;
  if(ok){e.preventDefault();showC();}
});

/* ---- Video ke neeche info: Like / Share / Agla / Autoplay ---- */
function chip(t,f,on){var b=document.createElement("button");b.type="button";b.className="chip"+(on?" on":"");b.textContent=t;b.onclick=f;return b;}
function share(){var u="https://www.youtube.com/watch?v="+cur.id;if(navigator.share)navigator.share({title:dec(cur.t),url:u}).catch(function(){});else if(navigator.clipboard)navigator.clipboard.writeText(u).then(function(){$("msg").textContent="Link copy ho gaya! 📋"});}
function info(){
  var i=$("info"),v=cur,L=ls("cd_like",[]),liked=L.indexOf(v.id)>=0;
  i.hidden=false;i.innerHTML="";
  var h=document.createElement("h3");h.textContent=dec(v.t);
  var p=document.createElement("p");p.textContent=[dec(v.ch),v.v].filter(Boolean).join(" • ");
  i.appendChild(h);i.appendChild(p);
  i.appendChild(chip(liked?"👍 Liked":"👍 Like",function(){var A=ls("cd_like",[]),k=A.indexOf(v.id);if(k<0)A.push(v.id);else A.splice(k,1);sv("cd_like",A);info();},liked));
  i.appendChild(chip("🔗 Share",share));
  i.appendChild(chip("⏭ Agla video",function(){nxt(1)}));
  i.appendChild(chip("▶ Autoplay: "+(autoNext?"ON":"OFF"),function(){autoNext=!autoNext;sv("cd_auto",autoNext);info();},autoNext));
}
